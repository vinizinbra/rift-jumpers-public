<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Play Rift Jumpers</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../logos/rift-jumpers-mark.svg?v=20261105" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&display=swap">
<style>
:root{--bg:#0a0f24;--ink:#fff;--muted:#b9bbca;--pink:#FD3971;--bar:52px;--ratio:calc(1386 / 788);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:600 14px/1.4 "Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
.bar{flex:none;height:var(--bar);display:flex;align-items:center;gap:16px;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.bar img{height:30px;width:auto;display:block}
.bar .right{margin-left:auto;display:flex;align-items:center;gap:18px}
.bar a.link,.bar button{font:800 11.5px/1 inherit;font-family:inherit;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:none;border:0;padding:8px 0;cursor:pointer}
.bar a.link:hover,.bar button:hover{color:var(--pink)}
.bar button[hidden]{display:none}
main{flex:1;min-height:0;display:grid;place-items:center;padding:0 max(0px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(0px,env(safe-area-inset-left))}
.stage{position:relative;width:min(100vw,calc((100dvh - var(--bar)) * var(--ratio)));aspect-ratio:1386/788;background:#000;overflow:hidden}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.stage:fullscreen{width:100%;height:100%;aspect-ratio:auto}
.gate{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;cursor:pointer;color:#fff;font-family:inherit;background:#0a0f24 url("../img/play-background.jpg") center/cover no-repeat;display:grid;place-items:center;align-content:center;gap:16px}
.gate::before{content:"";position:absolute;inset:0;background:rgba(10,15,36,.42);transition:background .15s}
.gate:hover::before{background:rgba(10,15,36,.28)}
.gate>*{position:relative}
.gate .disc{width:clamp(64px,10vmin,96px);aspect-ratio:1;border-radius:50%;background:var(--pink);border:3px solid #fff;display:grid;place-items:center;box-shadow:0 10px 40px rgba(253,57,113,.45)}
.gate .disc svg{width:38%;margin-left:6%}
.gate b{font-size:clamp(1.3rem,3.2vmin,2rem);font-weight:900;letter-spacing:-.01em;text-transform:uppercase;text-shadow:0 2px 0 #0a0f24,0 3px 14px rgba(10,15,36,.8)}
.lock{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 16px;max-width:420px;text-align:center}
.lock p{margin:0;font-size:14px;font-weight:600;color:#fff;text-shadow:0 1px 0 #0a0f24,0 2px 10px rgba(10,15,36,.9)}
.lock p a{color:#fff;text-decoration:underline;text-decoration-color:var(--pink);text-underline-offset:3px}
.lock form{display:flex;gap:8px;width:100%;max-width:340px}
.lock input{flex:1;min-width:0;font:600 15px/1 inherit;font-family:inherit;padding:12px 14px;border-radius:10px;border:2px solid #fff;background:rgba(10,15,36,.75);color:#fff}
.lock input::placeholder{color:var(--muted)}
.lock button{font:900 13px/1 inherit;font-family:inherit;letter-spacing:.08em;text-transform:uppercase;padding:0 18px;border-radius:10px;border:2px solid #fff;background:var(--pink);color:#fff;cursor:pointer}
.lock .err{color:#ffd0dc;font-size:12.5px;min-height:1em}
.gate.locked{cursor:default}
.gate.locked:hover::before{background:rgba(10,15,36,.42)}
.gate small{font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#fff;text-shadow:0 1px 0 #0a0f24,0 2px 10px rgba(10,15,36,.9)}
</style>
<script defer src="https://cloud.umami.is/script.js" data-website-id="ec12085d-d64f-4396-bc3d-f3ccdd5e73f3"></script>
</head>
<body>
<header class="bar">
  <a href="../"><img src="../logos/rift-jumpers-logo-white.svg?v=20261105" alt="Rift Jumpers press kit" style="height:40px"></a>
  <div class="right">
    <button id="fs" type="button" hidden>Fullscreen ⛶</button>
    <a class="link" href="../">Press kit</a>
  </div>
</header>
<main>
  <div class="stage" id="stage">
    <div class="gate locked" id="gate">
      <span class="disc"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M6 4l14 8-14 8z"/></svg></span>
      <b>Play the playtest</b>
      <div class="lock">
        <p>This needs a password. Please contact <a href="mailto:admin@pachagames.com?subject=Rift%20Jumpers%20playtest%20access">admin@pachagames.com</a> for access.</p>
        <form id="unlock" autocomplete="off">
          <input id="pw" type="password" placeholder="Password" aria-label="Playtest password" required>
          <button type="submit">Play ▶</button>
        </form>
        <span class="err" id="err" role="status"></span>
      </div>
      <small>Runs in your browser · About 70 MB · Best on desktop</small>
    </div>
  </div>
</main>
<script>
// The itch embed URL is AES-GCM encrypted with a key derived (PBKDF2) from the playtest password,
// so it never appears in this page's source. Change the password by re-encrypting LOCK.
var LOCK = {"s": "lMoU8RIwKo279VGRJ2Tr6g==", "i": "0b632vafbqbghjgL", "c": "cFC0O5QoGh7TKWZyilw/8p1mybxPKjCf+75n9x2gVB2oDrb9uoA4WVwPzoaVaSTa1iXBm1vp5jxgNL4iBBxi1JDv3GrxnLgiuwglZKll5Ae1J/NZNmGeJHuSWEtv9g4Ok1wJNQ=="};
var stage = document.getElementById("stage"), gate = document.getElementById("gate"), fs = document.getElementById("fs");
var form = document.getElementById("unlock"), pw = document.getElementById("pw"), err = document.getElementById("err");
function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
function unlock(password) {
  var enc = new TextEncoder();
  return crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]).then(function (base) {
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(LOCK.s), iterations: 250000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  }).then(function (key) {
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(LOCK.i) }, key, b64(LOCK.c));
  }).then(function (buf) { return new TextDecoder().decode(buf); });
}
function start(url) {
  var f = document.createElement("iframe");
  f.src = url;
  f.title = "Rift Jumpers";
  f.allow = "autoplay; fullscreen *; gamepad; cross-origin-isolated; web-share";
  f.setAttribute("allowfullscreen", "true");
  f.scrolling = "no";
  stage.appendChild(f);
  gate.remove();
  f.focus();
  if (stage.requestFullscreen) fs.hidden = false;
}
function remember(v) { try { localStorage.setItem("rj.playtest", v); } catch (e) {} }
function saved() { try { return localStorage.getItem("rj.playtest"); } catch (e) { return null; } }
form.addEventListener("submit", function (e) {
  e.preventDefault();
  err.textContent = "Checking…";
  var value = pw.value;
  unlock(value).then(function (url) {
    remember(value);
    if (window.umami) umami.track("Playtest unlock");
    start(url);
  }).catch(function () {
    err.textContent = "Wrong password. Ask admin@pachagames.com for access.";
    pw.select();
  });
});
fs.addEventListener("click", function () { stage.requestFullscreen(); });
var prev = saved();
if (prev) unlock(prev).then(function (url) { if (location.hash === "#start") start(url); else { pw.value = prev; } }).catch(function () { remember(""); });
</script>
</body>
</html>
