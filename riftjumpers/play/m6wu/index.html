<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Play Rift Jumpers</title>
<meta name="robots" content="noindex,nofollow">
<meta property="og:title" content="Play Rift Jumpers">
<meta property="og:description" content="1-4 player online co-op roguelite shooter by Pacha Games. Runs in your browser.">
<meta property="og:image" content="https://pachagames.com/riftjumpers/deck/img/og.jpg">
<link rel="icon" href="../../logos/rift-jumpers-mark.svg?v=20261105" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&display=swap">
<style>
:root{--bg:#0a0f24;--ink:#fff;--muted:#b9bbca;--pink:#FD3971;--bar:52px;--ratio:calc(1386 / 788);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:600 14px/1.4 "Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
.bar{flex:none;height:var(--bar);display:flex;align-items:center;gap:16px;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.bar img{height:40px;width:auto;display:block}
.bar .right{margin-left:auto;display:flex;align-items:center;gap:18px}
.bar a.link,.bar button{font:800 11.5px/1 inherit;font-family:inherit;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:none;border:0;padding:8px 0;cursor:pointer}
.bar a.link:hover,.bar button:hover{color:var(--pink)}
.bar button[hidden],.bar a[hidden]{display:none}
main{flex:1;min-height:0;display:grid;place-items:center;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.stage{position:relative;width:min(100vw,calc((100dvh - var(--bar)) * var(--ratio)));aspect-ratio:1386/788;background:#000;overflow:hidden}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.stage:fullscreen{width:100%;height:100%;aspect-ratio:auto}
.gate{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;color:#fff;font-family:inherit;background:#0a0f24 url("../../img/play-background.jpg") center/cover no-repeat;display:grid;place-items:center;align-content:center;gap:16px;cursor:pointer}
.gate::before{content:"";position:absolute;inset:0;background:rgba(10,15,36,.42);transition:background .15s}
.gate:hover::before{background:rgba(10,15,36,.28)}
.gate>*{position:relative}
.gate .disc{width:clamp(64px,10vmin,96px);aspect-ratio:1;border-radius:50%;background:var(--pink);border:3px solid #fff;display:grid;place-items:center;box-shadow:0 10px 40px rgba(253,57,113,.45)}
.gate .disc svg{width:38%;margin-left:6%}
.gate b{font-size:clamp(1.3rem,3.2vmin,2rem);font-weight:900;letter-spacing:-.01em;text-transform:uppercase;text-shadow:0 2px 0 #0a0f24,0 3px 14px rgba(10,15,36,.8)}
.gate small{font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#fff;text-shadow:0 1px 0 #0a0f24,0 2px 10px rgba(10,15,36,.9)}
.gate.waiting{cursor:default}
.gate.waiting .disc{opacity:.5}
.gate .msg{max-width:420px;padding:0 16px;text-align:center;font-size:14px;color:#ffd0dc;text-shadow:0 1px 0 #0a0f24,0 2px 10px rgba(10,15,36,.9)}
.gate .msg a{text-decoration:underline;text-decoration-color:var(--pink);text-underline-offset:3px}
</style>
<script defer src="https://cloud.umami.is/script.js" data-website-id="ec12085d-d64f-4396-bc3d-f3ccdd5e73f3"></script>
</head>
<body>
<header class="bar">
  <a href="../../"><img src="../../logos/rift-jumpers-logo-white.svg?v=20261105" alt="Rift Jumpers"></a>
  <div class="right">
    <button id="fs" type="button" hidden>Fullscreen ⛶</button>
    <a class="link" id="deck" href="#" hidden>Pitch deck</a>
    <a class="link" href="https://store.steampowered.com/app/5545250/?utm_source=pachagames&amp;utm_medium=play" target="_blank" rel="noopener" id="steam">Steam ↗</a>
  </div>
</header>
<main>
  <div class="stage" id="stage">
    <button class="gate waiting" id="gate" type="button">
      <span class="disc"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M6 4l14 8-14 8z"/></svg></span>
      <b>Play Rift Jumpers</b>
      <small id="sub">Runs in your browser · About 70 MB · Best on desktop with a gamepad</small>
    </button>
  </div>
</main>
<script>
// The build link is AES-GCM encrypted; the key is the part of this page's link after "#", which only the
// person the link was sent to has. Generated by Marketing/Pitch/PlaytestLinks (private).
var LOCK = {"s":"9Fb9rUpAo/WUCWfpvdiy3Q==","i":"Uss4B3PgK0rkjYOO","c":"13zIdPvytRWhjPo4nBFRlSIYRSqtMU2+e8pJ1i3N+f/+D+aPywvcCpS/2KOqkEbUgjVgBL3draUW07+B+BEiAMa8bMNnS1sEE4Xuz5C7bGoEyziKFZMbDQ6+VKZ2uxu5AXMGkw=="};
var REF = "m6wu";
var stage = document.getElementById("stage"), gate = document.getElementById("gate"), fs = document.getElementById("fs");
var url = null, started = 0, minutes = 0;
function track(name, extra) {
  var data = { ref: REF };
  for (var k in extra) data[k] = extra[k];
  try { if (window.umami) umami.track(name, data); else setTimeout(function () { if (window.umami) umami.track(name, data); }, 1500); } catch (e) {}
}
function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
function unlock(key) {
  var enc = new TextEncoder();
  return crypto.subtle.importKey("raw", enc.encode(key), "PBKDF2", false, ["deriveKey"]).then(function (base) {
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(LOCK.s), iterations: 250000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  }).then(function (k) {
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(LOCK.i) }, k, b64(LOCK.c));
  }).then(function (buf) { return new TextDecoder().decode(buf); });
}
function start() {
  if (!url || started) return;
  started = Date.now();
  var f = document.createElement("iframe");
  f.src = url; f.title = "Rift Jumpers";
  f.allow = "autoplay; fullscreen *; gamepad; cross-origin-isolated; web-share";
  f.setAttribute("allowfullscreen", "true"); f.scrolling = "no";
  stage.appendChild(f); gate.remove(); f.focus();
  if (stage.requestFullscreen) fs.hidden = false;
  track("Build play");
  // minutes with the game on screen (tab visible), sent once per minute
  setInterval(function () {
    if (document.visibilityState !== "visible") return;
    minutes++;
    if (minutes <= 5 || minutes % 5 === 0) track("Build minutes", { minutes: minutes });
  }, 60000);
}
gate.addEventListener("click", start);
fs.addEventListener("click", function () { stage.requestFullscreen(); track("Build fullscreen"); });
document.getElementById("steam").addEventListener("click", function () { track("Build steam"); });
unlock(decodeURIComponent(location.hash.slice(1))).then(function (u) {
  url = u; gate.classList.remove("waiting");
  var deck = document.getElementById("deck");
  deck.href = "/riftjumpers/deck/" + REF + "/" + location.hash; deck.hidden = false;
  deck.addEventListener("click", function () { track("Build deck"); });
  track("Build open");
}).catch(function () {
  gate.querySelector("b").textContent = "Link incomplete";
  document.getElementById("sub").outerHTML = '<p class="msg">This link seems to be cut off. Please open the full link from the email, or write to <a href="mailto:vini@pachagames.com">vini@pachagames.com</a>.</p>';
  track("Build bad link");
});
</script>
</body>
</html>
